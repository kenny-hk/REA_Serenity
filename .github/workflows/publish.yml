name: Collect and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: serenity-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection and validation
        run: python -m unittest discover -s tests -v
      - name: Collect public posts
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '100' }}
        run: python scripts/update.py
      - name: Record collection result
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/tracker.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: record daily collection result'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag collection failure after publishing status
        if: steps.collect.outcome == 'failure'
        run: exit 1
